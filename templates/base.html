{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Viewy{% endblock %}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/favicon-180.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <script src="{% static 'js/animations.js' %}" defer></script>
    <script src="{% static 'js/nav.js' %}" defer></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-paper text-ink font-sans antialiased">
    {% include "partials/_navbar.html" %}
    {% include "partials/_tabbar_mobile.html" %}

    <main class="mx-auto max-w-[1360px] px-5 pb-28 pt-8 md:px-10 md:pb-16 md:pt-12 xl:px-14">
        {% include "partials/_toasts.html" %}
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
