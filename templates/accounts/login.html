{% extends "base.html" %}

{% block title %}Viewy — Iniciar sesión{% endblock %}

{% block content %}
    <h1>Iniciar sesión</h1>

    {% if form.errors %}
        <p>Usuario o contraseña incorrectos.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>

    <p><a href="{% url 'accounts:register' %}">Crear cuenta</a></p>
{% endblock %}
