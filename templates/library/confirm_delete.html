{% extends "base.html" %}

{% block title %}Viewy — Eliminar registro{% endblock %}

{% block content %}
    <div class="mx-auto max-w-md rounded-2xl border border-zinc-900 bg-zinc-900/50 p-6 text-center">
        <h1 class="mb-2 text-xl font-bold text-white">¿Eliminar "{{ entry.media.title }}"?</h1>
        <p class="mb-6 text-sm text-zinc-400">Se eliminará de tu biblioteca. Esta acción no se puede deshacer.</p>

        <form method="post" class="flex justify-center gap-3">
            {% csrf_token %}
            <a href="{% url 'library:list' %}"
               class="rounded-full border border-zinc-800 px-5 py-2 text-sm font-semibold text-zinc-300 transition-colors hover:bg-zinc-900">
                Cancelar
            </a>
            <button type="submit"
                    class="rounded-full bg-red-500 px-5 py-2 text-sm font-semibold text-white transition-colors hover:bg-red-400">
                Sí, eliminar
            </button>
        </form>
    </div>
{% endblock %}
